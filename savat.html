<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savat — YasinDoors</title>
<meta name="theme-color" content="#17130f">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
<link rel="stylesheet" href="savat.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">Yasin<span>Doors</span></a>
    <div class="top-actions">
      <a class="top-link" href="katalog.html">Katalog</a>
      <a class="top-link current" href="savat.html" data-cart-link aria-current="page">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
        <span class="lbl-long">Savat</span><span class="yd-cart-badge" data-cart-badge hidden>0</span>
      </a>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Rangni almashtirish">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8l1.8-1.8M18 6l1.8-1.8"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="crumbs"><a href="index.html">Bosh sahifa</a> / Savat</div>
  <div class="page-title"><h1>Savat</h1></div>

  <!-- Tayyor bo'lish muddati -->
  <section class="term-banner" aria-labelledby="termTitle">
    <div class="ic">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    </div>
    <div>
      <h2 id="termTitle">Buyurtmangiz <b id="termDays"></b> ichida tayyor bo'ladi</h2>
      <p>Har bir eshik buyurtma asosida, siz tanlagan o'lcham va jihozlar bilan alohida tayyorlanadi. Shu sababli tayyor eshik omborda turmaydi.</p>
      <div class="est">Bugun buyurtma bersangiz: <b id="termRange"></b></div>
    </div>
  </section>

  <div id="cartArea"></div>
</main>

<!-- MANZILNI XARITADAN TANLASH OYNASI -->
<div class="map-modal" id="mapModal" role="dialog" aria-modal="true" aria-labelledby="mapModalTitle" aria-hidden="true">
  <div class="map-modal-card">
    <div class="map-modal-head">
      <h3 id="mapModalTitle">Manzilni xaritadan tanlang</h3>
      <button type="button" class="map-close" id="mapCloseBtn" aria-label="Yopish">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="map-search">
      <input type="text" id="mapSearchInput" placeholder="Manzilni qidiring: masalan, Jizzax, Sharof Rashidov ko'chasi" aria-label="Manzilni qidirish">
      <button type="button" class="btn" id="mapSearchBtn">Qidirish</button>
      <button type="button" class="btn" id="mapLocateBtn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
        Mening joylashuvim
      </button>
    </div>
    <div id="pickerMap"></div>
    <div class="map-status" id="mapStatus"></div>
    <div class="map-picked" id="mapPicked"></div>
    <div class="map-modal-foot">
      <button type="button" class="btn" id="mapCancelBtn">Bekor qilish</button>
      <button type="button" class="btn primary" id="mapConfirmBtn" disabled>Shu manzilni tanlash</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="bot-config.js"></script>
<script src="models-data.js"></script>
<script src="savat.js"></script>
<script src="savat-page.js"></script>
</body>
</html>
