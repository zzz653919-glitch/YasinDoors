<body data-page="contact">

    <section class="phero"><div class="container reveal"><p class="eyebrow">YasinDoors</p><h1>Siz bilan bog‘lanishni istaymiz</h1><p>Savollaringiz bo‘lsa yoki eshik tanlashda yordam kerak bo‘lsa, bizga yozing.</p></div></section>
